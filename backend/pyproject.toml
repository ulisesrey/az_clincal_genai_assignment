[project]
name = "spend-assistant"
version = "0.1.0"
description = "Finance spend intelligence assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pandas>=3.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spend_assistant"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]

[project]
name = "spend-assistant"
version = "0.1.0"
description = "Finance spend intelligence assistant backend"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.43.123",
    "fastapi>=0.162.0",
    "pandas>=3.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spend_assistant"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
